[package]
name = "app"
version = "0.1.5"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# devtools feature:release 构建也允许 window.open_devtools()(右键「检查元素」)。debug 构建天然带。
tauri = { version = "2.11.2", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.8"
sysinfo = "0.32"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
# 监听绑定目录的 package.json:变更(防抖后)emit pkg-changed,前端重扫 scripts。
# full 版会把 atomic-save 的 rename from/to 合并成单事件,避免编辑器保存触发重复扫。
notify-debouncer-full = "0.5"

# unix 专属:进程组/信号(getpgid / kill(-pgid) / kill(pid,0))。Windows 走 platform.rs 的进程树方案,不需 libc。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS 原生:强制 app 级深色外观,让全屏时系统菜单栏跟随深色(与玻璃 UI 一致)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
